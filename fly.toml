# fly.toml app configuration file generated for xray-render on 2026-11-25T04:05:05Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'xray-render'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
