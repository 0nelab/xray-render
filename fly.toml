# fly.toml app configuration file generated for 0nelab-xray-fly on 2026-11-25T04:30:16Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "0nelab-xray-fly"
primary_region = 'ams'

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1
  auto_start_machines = true

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
