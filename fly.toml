# Fly.io deployment config for xray-render (Fly edition).
# Shares the same Dockerfile / app.js / config.json as the Northflank edition;
# the repo needs no other change. Only this file is new.
#
# Shape notes (why it is built this way):
# - One Machine, always on, smallest size: stays inside the Free plan's $5/mo.
# - Public entry is HTTPS 443 only, routed by the app domain to internal 3000,
#   where app.js proxies WebSocket traffic to the xray inbound (same as Northflank).
# - No dedicated IPv4, no UDP services: the Free plan does not include them.

app = "0nelab-xray-fly"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
